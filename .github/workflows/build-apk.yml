name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Required for AGP 9.x)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Accept Android Licenses & Set up NDK
        run: |
          yes | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "y" | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006" || true

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -Pandroid.enableMinifyInReleaseBuilds=false -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" --no-daemon --stacktrace 2>&1 | tee ../gradle.log || {
            echo "=== RELEASE BUILD FAILED, TRYING DEBUG BUILD ==="
            ./gradlew assembleDebug -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" --no-daemon --stacktrace 2>&1 | tee -a ../gradle.log || {
              echo "=== GRADLE LOG (LAST 150 LINES) ==="
              tail -n 150 ../gradle.log
              exit 1
            }
          }

      - name: Locate Generated APKs
        run: |
          echo "=== Found APKs ==="
          find android/ -name "*.apk" -ls

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keel-apk
          path: android/app/build/outputs/apk/**/*.apk

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Keel v1.0.0 (Latest Release)' }}
          files: android/app/build/outputs/apk/**/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
